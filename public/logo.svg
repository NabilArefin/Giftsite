<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cake gradients -->
    <linearGradient id="cakeTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e0b8"/>
      <stop offset="50%" stop-color="#e8c88a"/>
      <stop offset="100%" stop-color="#d4a96a"/>
    </linearGradient>
    <linearGradient id="cakeMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b6340"/>
      <stop offset="50%" stop-color="#6b4226"/>
      <stop offset="100%" stop-color="#4a2c1a"/>
    </linearGradient>
    <linearGradient id="cakeBot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a04040"/>
      <stop offset="50%" stop-color="#8b2e2e"/>
      <stop offset="100%" stop-color="#6a1e1e"/>
    </linearGradient>
    <!-- Frosting gradient -->
    <linearGradient id="frostTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffef8"/>
      <stop offset="50%" stop-color="#faf2e0"/>
      <stop offset="100%" stop-color="#f0e0c8"/>
    </linearGradient>
    <linearGradient id="frostChoc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c3317"/>
      <stop offset="50%" stop-color="#4a2810"/>
      <stop offset="100%" stop-color="#3a1e0a"/>
    </linearGradient>
    <!-- Plate gradient -->
    <linearGradient id="plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e0e4"/>
    </linearGradient>
    <!-- Candle gradient -->
    <linearGradient id="candle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8a090"/>
      <stop offset="30%" stop-color="#f5e8e0"/>
      <stop offset="50%" stop-color="#fff5f0"/>
      <stop offset="70%" stop-color="#f5e8e0"/>
      <stop offset="100%" stop-color="#c8a090"/>
    </linearGradient>
    <!-- Flame gradient -->
    <radialGradient id="flame" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#6ea8e0"/>
      <stop offset="8%" stop-color="#8eb8e8"/>
      <stop offset="14%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#fffde0"/>
      <stop offset="32%" stop-color="#fff176"/>
      <stop offset="48%" stop-color="#ffbf37"/>
      <stop offset="65%" stop-color="#ff8a3c"/>
      <stop offset="85%" stop-color="rgba(255,70,20,0.3)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Flame glow -->
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,220,80,0.4)"/>
      <stop offset="50%" stop-color="rgba(255,160,40,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Background circle gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fff6ef"/>
      <stop offset="40%" stop-color="#ffe6ef"/>
      <stop offset="100%" stop-color="#eef8ff"/>
    </radialGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#3e2040" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>

  <!-- Cake group with shadow -->
  <g filter="url(#shadow)">

    <!-- ===== PLATE ===== -->
    <ellipse cx="256" cy="400" rx="165" ry="22" fill="url(#plate)"/>
    <ellipse cx="256" cy="398" rx="160" ry="18" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
    <ellipse cx="256" cy="400" rx="165" ry="22" fill="none" stroke="rgba(200,180,190,0.3)" stroke-width="1"/>

    <!-- ===== BOTTOM TIER — Red Velvet ===== -->
    <rect x="105" y="332" width="302" height="68" rx="8" fill="url(#cakeBot)"/>
    <!-- Bottom tier highlight -->
    <rect x="105" y="332" width="302" height="8" rx="8" fill="rgba(255,255,255,0.12)"/>
    <!-- Bottom tier right shadow -->
    <rect x="380" y="332" width="27" height="68" rx="0" fill="rgba(0,0,0,0.07)"/>

    <!-- Cream cheese frosting — bottom -->
    <rect x="100" y="324" width="312" height="16" rx="10" fill="url(#frostTop)"/>
    <rect x="100" y="324" width="312" height="4" rx="10" fill="rgba(255,255,255,0.7)"/>
    <!-- Cream cheese drips — bottom tier -->
    <ellipse cx="145" cy="340" rx="8" ry="18" fill="#faf2e0"/>
    <ellipse cx="210" cy="340" rx="10" ry="24" fill="#faf2e0"/>
    <ellipse cx="280" cy="340" rx="7" ry="14" fill="#faf2e0"/>
    <ellipse cx="340" cy="340" rx="9" ry="20" fill="#faf2e0"/>
    <ellipse cx="385" cy="340" rx="8" ry="16" fill="#faf2e0"/>

    <!-- ===== MIDDLE TIER — Chocolate ===== -->
    <rect x="140" y="252" width="232" height="72" rx="8" fill="url(#cakeMid)"/>
    <rect x="140" y="252" width="232" height="8" rx="8" fill="rgba(255,255,255,0.1)"/>
    <rect x="345" y="252" width="27" height="72" rx="0" fill="rgba(0,0,0,0.08)"/>

    <!-- Chocolate ganache frosting — mid -->
    <rect x="135" y="244" width="242" height="16" rx="10" fill="url(#frostChoc)"/>
    <rect x="135" y="244" width="242" height="4" rx="10" fill="rgba(255,255,255,0.1)"/>
    <!-- Chocolate drips — mid tier -->
    <ellipse cx="175" cy="260" rx="8" ry="18" fill="#4a2810"/>
    <ellipse cx="230" cy="260" rx="9" ry="22" fill="#4a2810"/>
    <ellipse cx="290" cy="260" rx="7" ry="14" fill="#4a2810"/>
    <ellipse cx="340" cy="260" rx="8" ry="18" fill="#4a2810"/>
    <ellipse cx="365" cy="260" rx="7" ry="14" fill="#4a2810"/>

    <!-- ===== TOP TIER — Vanilla ===== -->
    <rect x="175" y="188" width="162" height="56" rx="8" fill="url(#cakeTop)"/>
    <rect x="175" y="188" width="162" height="8" rx="8" fill="rgba(255,255,255,0.2)"/>
    <rect x="310" y="188" width="27" height="56" rx="0" fill="rgba(0,0,0,0.06)"/>

    <!-- Buttercream frosting — top -->
    <rect x="170" y="180" width="172" height="16" rx="10" fill="url(#frostTop)"/>
    <rect x="170" y="180" width="172" height="4" rx="10" fill="rgba(255,255,255,0.8)"/>
    <!-- Buttercream drips — top tier -->
    <ellipse cx="200" cy="196" rx="6" ry="14" fill="#faf0e0"/>
    <ellipse cx="250" cy="196" rx="8" ry="18" fill="#faf0e0"/>
    <ellipse cx="305" cy="196" rx="6" ry="12" fill="#faf0e0"/>
    <ellipse cx="330" cy="196" rx="7" ry="16" fill="#faf0e0"/>

    <!-- ===== CANDLES ===== -->
    <!-- Candle 1 (left) -->
    <rect x="220" y="136" width="12" height="44" rx="3" fill="url(#candle)"/>
    <!-- Wick -->
    <rect x="225" y="130" width="2" height="7" rx="1" fill="#3a2a1a"/>
    <!-- Wax drip -->
    <rect x="218" y="148" width="5" height="12" rx="2" fill="#f5e8e0"/>

    <!-- Candle 2 (center) -->
    <rect x="250" y="136" width="12" height="44" rx="3" fill="url(#candle)"/>
    <!-- Wick -->
    <rect x="255" y="130" width="2" height="7" rx="1" fill="#3a2a1a"/>
    <!-- Wax drip -->
    <rect x="248" y="144" width="5" height="14" rx="2" fill="#f5e8e0"/>

    <!-- Candle 3 (right) -->
    <rect x="280" y="136" width="12" height="44" rx="3" fill="url(#candle)"/>
    <!-- Wick -->
    <rect x="285" y="130" width="2" height="7" rx="1" fill="#3a2a1a"/>
    <!-- Wax drip -->
    <rect x="278" y="150" width="5" height="10" rx="2" fill="#f5e8e0"/>

    <!-- ===== FLAMES ===== -->
    <!-- Flame glow backgrounds -->
    <ellipse cx="226" cy="118" rx="22" ry="22" fill="url(#flameGlow)"/>
    <ellipse cx="256" cy="118" rx="22" ry="22" fill="url(#flameGlow)"/>
    <ellipse cx="286" cy="118" rx="22" ry="22" fill="url(#flameGlow)"/>

    <!-- Flame 1 -->
    <ellipse cx="226" cy="114" rx="7" ry="12" fill="url(#flame)" filter="url(#softGlow)"/>
    <!-- Flame 2 -->
    <ellipse cx="256" cy="114" rx="7" ry="12" fill="url(#flame)" filter="url(#softGlow)"/>
    <!-- Flame 3 -->
    <ellipse cx="286" cy="114" rx="7" ry="12" fill="url(#flame)" filter="url(#softGlow)"/>

  </g>

  <!-- Sparkle dots around the cake -->
  <circle cx="100" cy="160" r="3" fill="#f5c85b" opacity="0.7"/>
  <circle cx="412" cy="200" r="2.5" fill="#e34f6f" opacity="0.6"/>
  <circle cx="80" cy="280" r="2" fill="#7b61ff" opacity="0.5"/>
  <circle cx="430" cy="310" r="2.5" fill="#9ed7c1" opacity="0.6"/>
  <circle cx="120" cy="380" r="2" fill="#ff8c72" opacity="0.5"/>
  <circle cx="400" cy="130" r="2" fill="#f5c85b" opacity="0.5"/>
</svg>
