<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Box Gradients for 3D Lighting -->
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="100%" stop-color="#fbc02d" />
    </linearGradient>

    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbc02d" />
      <stop offset="100%" stop-color="#f57f17" />
    </linearGradient>

    <linearGradient id="boxRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f57f17" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>

    <!-- Drop Shadow for the entire box -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>

    <!-- Blur for ground and contact shadows -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="430" rx="140" ry="25" fill="#000" opacity="0.2" filter="url(#blur)" />

  <!-- Main Gift Box Group -->
  <g filter="url(#shadow)">

    <!-- ================= BOX BODY ================= -->
    <!-- Left Face -->
    <polygon points="145,245 145,355 250,417 250,307" fill="url(#boxLeft)" />
    <!-- Right Face -->
    <polygon points="250,307 250,417 355,355 355,245" fill="url(#boxRight)" />

    <!-- ================= LID ================= -->
    <!-- Lid Top Face -->
    <polygon points="250,160 140,225 250,290 360,225" fill="url(#boxTop)" />
    <!-- Lid Left Overhang -->
    <polygon points="140,225 140,240 250,305 250,290" fill="#fbc02d" />
    <!-- Lid Right Overhang -->
    <polygon points="250,290 250,305 360,240 360,225" fill="#f57f17" />

    <!-- ================= RIBBONS (BASE LAYER) ================= -->
    <!-- Base Ribbon Color (Rich Satin Red) -->
    <g fill="#d32f2f">
      <!-- Top Face Ribbons (Cross) -->
      <!-- Strip 1 (Top-Left to Bottom-Right) -->
      <polygon points="195,192.5 305,257.5 315,251.5 205,186.5" />
      <!-- Strip 2 (Top-Right to Bottom-Left) -->
      <polygon points="305,192.5 195,257.5 185,251.5 295,186.5" />

      <!-- Vertical Ribbon on Left Face -->
      <polygon points="185,266.6 195,272.5 195,384.5 185,378.6" />
      <!-- Vertical Ribbon on Right Face -->
      <polygon points="295,278.4 305,272.5 305,384.5 295,390.4" />
    </g>

    <!-- ================= RIBBONS (HIGHLIGHTS & SHADOWS) ================= -->
    <!-- Satin Highlights (White with opacity) -->
    <g fill="#ffffff" opacity="0.35">
      <!-- Top Strip 1 Highlight -->
      <polygon points="200,191 310,256 312,254.5 202,189.5" />
      <!-- Top Strip 2 Highlight -->
      <polygon points="300,191 190,256 188,254.5 298,189.5" />
      <!-- Left Vertical Highlight -->
      <polygon points="188,268 190,269 190,381 188,380" />
      <!-- Right Vertical Highlight -->
      <polygon points="300,275 302,274 302,386 300,387" />
    </g>

    <!-- Satin Shadows (Black with opacity) -->
    <g fill="#000000" opacity="0.2">
      <!-- Top Strip 1 Edges -->
      <polygon points="195,192.5 200,191 205,186.5 198,188" />
      <polygon points="310,256 315,251.5 312,254.5 308,257" />
      <!-- Top Strip 2 Edges -->
      <polygon points="305,192.5 300,191 295,186.5 302,188" />
      <polygon points="190,256 185,251.5 188,254.5 192,257" />
    </g>

    <!-- ================= BOX EDGE HIGHLIGHTS ================= -->
    <!-- Enhances the 3D crispness -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Lid Top Edges -->
      <polyline points="140,225 250,160 360,225" stroke="#ffffff" stroke-width="2" opacity="0.6" />
      <!-- Lid Front Edges -->
      <polyline points="140,225 250,290 360,225" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
      <!-- Box Body Left Edge -->
      <line x1="145" y1="245" x2="145" y2="355" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />
      <!-- Box Body Center Edge -->
      <line x1="250" y1="307" x2="250" y2="417" stroke="#000000" stroke-width="1.5" opacity="0.15" />
      <!-- Box Body Right Edge -->
      <line x1="355" y1="245" x2="355" y2="355" stroke="#000000" stroke-width="1.5" opacity="0.2" />
    </g>
  </g>

  <!-- ================= BOW SHADOW ================= -->
  <!-- Cast by the bow onto the lid -->
  <ellipse cx="250" cy="180" rx="45" ry="18" fill="#000" opacity="0.3" filter="url(#blur)" />

  <!-- ================= BOW ================= -->
  <g>
    <!-- Left Loop -->
    <path d="M 245 170 C 170 180, 120 130, 140 80 C 160 30, 230 110, 245 170 Z" fill="#d32f2f" />
    <!-- Left Loop Inner Shadow (Depth) -->
    <path d="M 245 170 C 190 160, 160 120, 150 90 C 170 110, 210 140, 245 170 Z" fill="#8e0000" opacity="0.5" />
    <!-- Left Loop Fold Line -->
    <path d="M 245 170 C 190 160, 160 120, 150 90" fill="none" stroke="#8e0000" stroke-width="2" opacity="0.6" stroke-linecap="round" />
    <!-- Left Loop Highlight -->
    <path d="M 235 160 C 175 165, 135 120, 145 85 C 148 75, 160 60, 175 65 C 150 80, 160 130, 235 150 Z" fill="#ffffff" opacity="0.25" />

    <!-- Right Loop -->
    <path d="M 255 170 C 330 180, 380 130, 360 80 C 340 30, 270 110, 255 170 Z" fill="#d32f2f" />
    <!-- Right Loop Inner Shadow (Depth) -->
    <path d="M 255 170 C 310 160, 340 120, 350 90 C 330 110, 290 140, 255 170 Z" fill="#8e0000" opacity="0.5" />
    <!-- Right Loop Fold Line -->
    <path d="M 255 170 C 310 160, 340 120, 350 90" fill="none" stroke="#8e0000" stroke-width="2" opacity="0.6" stroke-linecap="round" />
    <!-- Right Loop Highlight -->
    <path d="M 265 160 C 325 165, 365 120, 355 85 C 352 75, 340 60, 325 65 C 350 80, 340 130, 265 150 Z" fill="#ffffff" opacity="0.25" />

    <!-- Left Tail -->
    <path d="M 240 175 Q 190 240 160 300 L 175 307 L 190 315 Q 220 250 250 180 Z" fill="#d32f2f" />
    <!-- Left Tail Highlight -->
    <path d="M 235 180 Q 188 240 162 298 L 166 300 Q 192 242 238 182 Z" fill="#ffffff" opacity="0.3" />
    <!-- Left Tail Shadow -->
    <path d="M 245 180 Q 215 245 188 313 L 190 315 Q 220 250 250 180 Z" fill="#000000" opacity="0.2" />

    <!-- Right Tail -->
    <path d="M 260 175 Q 310 240 340 300 L 325 307 L 310 315 Q 280 250 250 180 Z" fill="#d32f2f" />
    <!-- Right Tail Highlight -->
    <path d="M 265 180 Q 312 240 338 298 L 334 300 Q 308 242 262 182 Z" fill="#ffffff" opacity="0.3" />
    <!-- Right Tail Shadow -->
    <path d="M 255 180 Q 285 245 312 313 L 310 315 Q 280 250 250 180 Z" fill="#000000" opacity="0.2" />

    <!-- Center Knot -->
    <path d="M 238 155 L 262 155 C 268 155, 270 160, 270 165 L 270 175 C 270 180, 268 185, 262 185 L 238 185 C 232 185, 230 180, 230 175 L 230 165 C 230 160, 232 155, 238 155 Z" fill="#d32f2f" />
    <!-- Knot Crease -->
    <path d="M 250 155 Q 247 170 250 185" fill="none" stroke="#8e0000" stroke-width="2" opacity="0.6" stroke-linecap="round" />
    <!-- Knot Highlight -->
    <ellipse cx="242" cy="162" rx="6" ry="3" fill="#ffffff" opacity="0.4" transform="rotate(-15 242 162)" />
  </g>
</svg>
